name: Copy signing secrets to rf-bridge (ONE-TIME)

on:
  workflow_dispatch:

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Copy APPLE_SIGNING_KEY to rf-bridge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SECRET_VALUE: ${{ secrets.APPLE_SIGNING_KEY }}
        run: |
          echo "$SECRET_VALUE" | gh secret set APPLE_SIGNING_KEY -R TheCollinsFamily/rf-bridge

      - name: Copy APPLE_SIGNING_CERT to rf-bridge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SECRET_VALUE: ${{ secrets.APPLE_SIGNING_CERT }}
        run: |
          echo "$SECRET_VALUE" | gh secret set APPLE_SIGNING_CERT -R TheCollinsFamily/rf-bridge

      - name: Verify secrets exist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "=== rf-bridge secrets ==="
          gh secret list -R TheCollinsFamily/rf-bridge
